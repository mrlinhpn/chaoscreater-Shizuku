name: Build App

on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Debug build'
        type: boolean
        required: false
        default: true

      prerelease:
        description: 'Prerelease'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        id: buildWithGradle
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          echo 'org.gradle.caching=true' >> gradle.properties
          echo 'org.gradle.parallel=true' >> gradle.properties

          # Mặc định build debug để không bắt buộc signing keystore
          if [ "${{ inputs.debug }}" = "false" ]; then
            CMD="./gradlew :manager:assembleRelease"
            APK_DIR="manager/build/outputs/apk/release"
          else
            CMD="./gradlew :manager:assembleDebug"
            APK_DIR="manager/build/outputs/apk/debug"
          fi

          eval $CMD
          FILE=$(ls $APK_DIR/*.apk | head -n 1)

          echo "filePath=$FILE" >> $GITHUB_OUTPUT
          echo "fileName=$(basename $FILE)" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.buildWithGradle.outputs.fileName }}
          path: ${{ steps.buildWithGradle.outputs.filePath }}
